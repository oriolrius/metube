[project]
name = "metube"
version = "0.1.0"
description = "Web GUI for youtube-dl (using yt-dlp) with playlist support"
requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "python-socketio>=5.0,<6.0",
    "yt-dlp[default,curl-cffi,deno]",
    "mutagen",
    "curl-cffi",
    "watchfiles",
]

[project.optional-dependencies]
# Conversational-agent extras. Install with `uv sync --extra agent`.
agent = [
    "google-adk[a2a]>=2.1,<3",
    "a2a-sdk[http-server]>=0.3,<0.4",
    "sse-starlette",
    "litellm",
    "uvicorn",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "openinference-instrumentation-google-adk>=0.1.15",
]

[dependency-groups]
dev = [
    "pylint",
    "pytest>=8.0",
    "pytest-aiohttp>=1.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
pythonpath = [".", "app"]
addopts = "-v"
